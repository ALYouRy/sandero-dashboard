name: Build APK
on:
  workflow_dispatch: {}
  push:
    branches: [main, 'reserve-*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accepter les licences Android
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          build-root-directory: Sandero
      - name: Compiler l'APK
        working-directory: Sandero
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sandero-dashboard-apk
          path: Sandero/app/build/outputs/apk/debug/app-debug.apk
      # Mise à jour par internet : l'appli de l'autoradio lit version.json et télécharge la-mathias.apk
      - name: Publier la mise à jour (Releases « latest »)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(grep -oP "versionCode\s+\K\d+" Sandero/app/build.gradle)
          NAME=$(grep -oP "versionName\s+['\"]\K[^'\"]+" Sandero/app/build.gradle)
          MSG=$(git log -1 --pretty=%s)
          cp Sandero/app/build/outputs/apk/debug/app-debug.apk la-mathias.apk
          python3 -c "import json,sys;print(json.dumps({'code':int(sys.argv[1]),'name':sys.argv[2],'notes':sys.argv[3]},ensure_ascii=False))" "$CODE" "$NAME" "$MSG" > version.json
          cat version.json
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest la-mathias.apk version.json --target "$GITHUB_SHA" --title "La Mathias $NAME" --notes "$MSG" --latest
          else
            # version gardée en réserve (branche reserve-x.y) : publiée à part, jamais proposée en mise à jour automatique
            gh release delete "$GITHUB_REF_NAME" --yes --cleanup-tag || true
            gh release create "$GITHUB_REF_NAME" la-mathias.apk version.json --target "$GITHUB_SHA" --title "La Mathias $NAME (réserve)" --notes "Version gardée en réserve. $MSG" --latest=false
          fi
