plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.sandero.dashboard'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.sandero.dashboard'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '2.0'
    }

    signingConfigs {
        fixe {
            storeFile file('sandero.jks')
            storePassword 'sandero2009'
            keyAlias 'sandero'
            keyPassword 'sandero2009'
        }
    }

    buildTypes {
        debug {
            if (file('sandero.jks').exists()) signingConfig signingConfigs.fixe
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
